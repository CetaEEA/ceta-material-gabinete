    ====================================================== -->

    <link

    >


    <!-- =====================================================

    ====================================================== -->

    <link
        rel="stylesheet"

    >

</head>


<body class="login-page">


    <main class="login-container">


        <section class="login-card">


            <!-- =================================================
                 LOGO
            ================================================== -->

            <img
                src="img/logo-ceta-transparente.png"
                alt="Logo CETA"
                class="login-logo"
            >


            <p class="login-instituto">
                INSTITUTO CETA
            </p>


            <h1>
                Material de Gabinete
            </h1>


            <p class="login-descripcion">
                Sistema de reserva y control de materiales
                para docentes del Instituto CETA.
            </p>


            <!-- =================================================
                 FORMULARIO
            ================================================== -->

            <form id="formLogin">


                <div class="campo">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="btnIngresar"
                    class="btn-principal"
                >
                    INGRESAR
                </button>


            </form>


            <p
                id="mensajeLogin"
                class="mensaje-login"
            ></p>


        </section>


    </main>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script
        src="js/supabase.js"
    ></script>


    <script
        src="js/login.js"
    ></script>


</body>

</html>
